<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Shorts Factory{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: #f5f5f5; color: #222; }
  nav { background: #1a1a2e; padding: 0 1.5rem; display: flex; align-items: stretch; gap: 0; }
  nav a {
    color: #ccc; text-decoration: none; padding: 1rem 1.25rem;
    display: inline-block; font-size: 0.9rem; letter-spacing: 0.03em;
  }
  nav a:hover { background: #16213e; color: #fff; }
  nav a.active { background: #0f3460; color: #e94560; font-weight: 600; }
  nav .brand { color: #e94560; font-weight: 700; font-size: 1rem; padding: 1rem 1.25rem 1rem 0; margin-right: 1rem; }
  main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #1a1a2e; }
  h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #333; }
  .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 1.25rem; margin-bottom: 1rem; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
  }
  .badge-draft     { background: #eee; color: #666; }
  .badge-pending   { background: #fff3cd; color: #856404; }
  .badge-running   { background: #cff4fc; color: #055160; }
  .badge-done      { background: #d1e7dd; color: #0f5132; }
  .badge-failed    { background: #f8d7da; color: #842029; }
  .badge-skipped   { background: #e2e3e5; color: #41464b; }
  button, .btn {
    background: #0f3460; color: #fff; border: none; padding: 0.5rem 1rem;
    border-radius: 4px; cursor: pointer; font-size: 0.875rem;
  }
  button:hover, .btn:hover { background: #16213e; }
  button:focus-visible, .btn:focus-visible { outline: 2px solid #e94560; outline-offset: 2px; }
  button:disabled, .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; }
  .btn-danger { background: #842029; }
  .btn-danger:hover { background: #6c1d23; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #ccc;
    border-radius: 4px; font-size: 0.9rem; font-family: inherit;
  }
  input:focus, textarea:focus { outline: 2px solid #0f3460; border-color: #0f3460; }
  label { display: block; margin-bottom: 0.4rem; font-size: 0.875rem; font-weight: 500; }
  .form-group { margin-bottom: 1rem; }
  .flash { padding: 0.75rem 1rem; border-radius: 4px; margin-bottom: 1rem; background: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
  .flash.error { background: #f8d7da; color: #842029; border-color: #f5c2c7; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th { text-align: left; padding: 0.5rem 0.75rem; background: #f0f0f0; border-bottom: 2px solid #ddd; }
  td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #eee; vertical-align: middle; }
  tr:hover td { background: #fafafa; }
  .env-key { font-family: monospace; font-size: 0.8rem; color: #555; }
  .env-val { font-family: monospace; font-size: 0.8rem; color: #333; }
</style>
</head>
<body>
<nav aria-label="Main Navigation">
  <span class="brand">Shorts Factory</span>
  <a href="/ideas" {% if active == 'ideas' %}class="active" aria-current="page"{% endif %}>Ideas</a>
  <a href="/pipeline" {% if active == 'pipeline' %}class="active" aria-current="page"{% endif %}>Pipeline</a>
  <a href="/voice" {% if active == 'voice' %}class="active" aria-current="page"{% endif %}>Voice</a>
  <a href="/config" {% if active == 'config' %}class="active" aria-current="page"{% endif %}>Config</a>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
