<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Shorts Factory</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: #f5f5f5; color: #222;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 2rem; width: 360px; }
  h1 { font-size: 1.25rem; margin-bottom: 1.5rem; color: #1a1a2e; }
  label { display: block; margin-bottom: 0.4rem; font-size: 0.875rem; font-weight: 500; }
  input[type=password] {
    width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #ccc;
    border-radius: 4px; font-size: 0.9rem; margin-bottom: 1rem;
  }
  input:focus { outline: 2px solid #0f3460; border-color: #0f3460; }
  button {
    width: 100%; background: #0f3460; color: #fff; border: none;
    padding: 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
  }
  button:hover { background: #16213e; }
  .error { color: #842029; background: #f8d7da; border: 1px solid #f5c2c7;
           padding: 0.6rem 0.75rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.875rem; }
</style>
</head>
<body>
<div class="login-box">
  <h1>Shorts Factory</h1>
  {% if error %}
  <div class="error" role="alert">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" onsubmit="this.querySelector('button[type=submit]').disabled = true; this.querySelector('button[type=submit]').textContent = 'Đang đăng nhập...';">
    <label for="token">Auth token</label>
    <input type="password" id="token" name="token" autofocus required placeholder="Dán token từ terminal">
    <button type="submit">Đăng nhập</button>
  </form>
</div>
</body>
</html>
