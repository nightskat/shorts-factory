[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "shorts-factory"
version = "0.1.0"
description = "Turn any idea into a YouTube Short — bring your own LLM, any language, any niche."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "edge-tts>=7.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
]
cli = [
    "typer>=0.12",
]
all = ["shorts-factory[web,cli]"]

[project.scripts]
shorts-factory = "shorts.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["shorts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
